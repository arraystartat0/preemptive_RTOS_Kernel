## openOCD is the layer between my GDB (TCP 3333) and the ST-LINK
## OpenOCD is a program on your PC. On one side it talks
##  USB to the ST-LINK. On the other it runs a TCP server 
##  speaking GDB's remote protocol. GDB then behaves as if 
## it's debugging an ordinary local process — it has no 
## idea there's a USB cable and a 2-wire serial bus in the
## path. OpenOCD does all the translation.
## That's the whole job: turn break main into SWD 
## transactions

## OpenOCD is generic. It supports hundreds of different 
## probes and thousands of different chips. It ships 
## knowing nothing about which ones you own. Run it bare 
## and it starts up, finds no device configured, and exits.

## The config file supplies the missing facts 
## and they map one-to-one onto the layers in that diagram:

## layer 1: probe (interface)

source [find interface/stlink.cfg]

## layer 2: transport protocol (SWD or JTAG)
transport select swd

## the silicon 
source [find target/stm32f3x.cfg]

## link tuning: how fast to clock SWCLK -> F_cpu/6. F_cpu = 8MHz so 1MHz is a good step down.
adapter speed 1000